# All targets live here - collectors contain no hard-coded targets.
# Entries marked VERIFY are best-effort starting values; check before relying on them: [DONE]
#   ASNs/prefixes: https://stat.ripe.net/ (announced-prefixes) or bgp.he.net
#   Atlas msm IDs: https://atlas.ripe.net/measurements/ (filter 'built-in' / by target)
#   IODA entity codes: https://ioda.inetintel.cc.gatech.edu/ (region pages show numeric IDs)

http:
  timeout_s: 20
  max_retries: 2
  min_interval_s: 0.5

collectors:
  ioda:
    enabled: true
    lookback_minutes: 60
    include_pakistan_asns: true
    fetch_outage_events: true
    entities:
      - {type: 'country', code: 'PK', group: 'pakistan', description: 'Pakistan national'}
      - {type: 'region', code: '3084', group: 'pakistan', description: 'Islamabad Capital Territory'}
      - {type: 'country', code: 'IN', group: 'cross_location', description: 'Neighbour control (India)'}
      - {type: 'country', code: 'AE', group: 'cross_location', description: 'Gulf transit control (UAE)'}
  ooni:
    enabled: true
    probe_cc: 'PK'
    lookback_minutes: 180
    test_names: ['web_connectivity']
    per_target_limit: 50
    summary_limit: 500
    max_detail_fetches: 5
  ripe_atlas:
    enabled: true
    lookback_minutes: 15
    max_pakistan_probes: 25
    control_countries: ['IN', 'AE', 'DE', 'SG']
    probes_per_control_country: 3
    extra_probe_ids: []
  bgp:
    enabled: true
    sourceapp: 'pk-connectivity-monitor'
    fetch_updates: true
    updates_lookback_minutes: 30
  runner_probe:
    enabled: true
    timeout_s: 8

