name: collect

on:
  schedule:
    - cron: '0 * * * *'   # best-effort; GitHub may delay runs
  workflow_dispatch: {}

# Serialise runs: no overlapping appends, so no JSONL merge conflicts
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check collection end date
        run: |
          END_DATE="2026-09-30T12:00:00Z"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "$NOW" >= "$END_DATE" ]]; then
            echo "Collection period has ended at 00:00 Sep 30 AoE"
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install --quiet -r requirements.txt

      - id: run
        run: python -m collector

      - name: Commit and push
        if: steps.run.outputs.meaningful == 'true'
        env:
          SLOT: ${{ steps.run.outputs.slot }}
        run: |
          git config user.name 'pk-monitor-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit --quiet -m "data: ${SLOT} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin "${GITHUB_REF_NAME}" \
               && git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
